<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17212b" />
  <title>Zynox</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- AUTH VIEW -->
  <main id="auth-view" class="auth hidden">
    <div class="auth-card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="84" height="84">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4fa3e0" />
              <stop offset="1" stop-color="#2b5ea7" />
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="32" fill="url(#lg)" />
          <path d="M20 22h24l-17 20h17" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h1 id="auth-title">Sign in to Zynox</h1>
      <p id="auth-sub" class="muted">Enter your username and password.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <input id="login-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder=" " />
          <label for="login-username">Username</label>
        </div>
        <div class="field">
          <input id="login-password" type="password" autocomplete="current-password" placeholder=" " />
          <label for="login-password">Password</label>
        </div>
        <p id="login-error" class="msg error"></p>
        <button class="btn" type="submit">Sign In</button>
      </form>

      <form id="signup-form" class="hidden" novalidate>
        <div class="field">
          <input id="signup-name" type="text" autocomplete="name" maxlength="64" placeholder=" " />
          <label for="signup-name">Your name</label>
        </div>
        <div class="field">
          <input id="signup-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="33" placeholder=" " />
          <label for="signup-username">Username</label>
        </div>
        <p id="username-status" class="msg hint">5-32 characters. Letters, numbers and underscores. Must start with a letter.</p>
        <div class="field">
          <input id="signup-password" type="password" autocomplete="new-password" placeholder=" " />
          <label for="signup-password">Password</label>
        </div>
        <p class="msg hint">At least 8 characters.</p>
        <p id="signup-error" class="msg error"></p>
        <button class="btn" type="submit">Create Account</button>
      </form>

      <button id="switch-mode" class="link" type="button">Create a new account</button>
    </div>
  </main>

  <!-- CHAT VIEW (shell) -->
  <div id="chat-view" class="chat hidden">
    <aside class="sidebar">
      <header class="sidebar-head">
        <div class="avatar" id="me-avatar"></div>
        <div class="me">
          <div class="me-name" id="me-name"></div>
          <div class="me-user" id="me-user"></div>
        </div>
        <button id="logout-btn" class="icon-btn" title="Sign out" aria-label="Sign out">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="M16 17l5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
        </button>
      </header>
      <div class="search">
        <input type="text" placeholder="Search" disabled />
      </div>
      <div class="list-empty">No chats yet</div>
    </aside>

    <section class="panel">
      <div class="panel-empty">
        <span class="pill">Select a chat to start messaging</span>
      </div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
