<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17212b" />
  <title>Zynox</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- AUTH VIEW -->
  <main id="auth-view" class="auth hidden">
    <div class="auth-card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="84" height="84">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4fa3e0" />
              <stop offset="1" stop-color="#2b5ea7" />
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="32" fill="url(#lg)" />
          <path d="M20 22h24l-17 20h17" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h1 id="auth-title">Sign in to Zynox</h1>
      <p id="auth-sub" class="muted"></p>

      <!-- step 1: email -->
      <form id="email-form" novalidate>
        <div class="field">
          <input id="email-input" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder=" " />
          <label for="email-input">Email address</label>
        </div>
        <p id="email-error" class="msg error"></p>
        <button class="btn" type="submit">Continue</button>
      </form>

      <!-- step 2: code -->
      <form id="otp-form" class="hidden" novalidate>
        <div class="field">
          <input id="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder=" " />
          <label for="otp-input">6-digit code</label>
        </div>
        <p id="otp-error" class="msg error"></p>
        <button class="btn" type="submit">Verify</button>
        <button id="resend-btn" class="link small" type="button" disabled>Resend code</button>
      </form>

      <!-- step 3: profile setup -->
      <form id="setup-form" class="hidden" novalidate>
        <div class="field">
          <input id="setup-name" type="text" autocomplete="name" maxlength="64" placeholder=" " />
          <label for="setup-name">Your name</label>
        </div>
        <div class="field">
          <input id="setup-username" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="33" placeholder=" " />
          <label for="setup-username">Username</label>
        </div>
        <p id="username-status" class="msg hint"></p>
        <div class="field">
          <input id="setup-password" type="password" autocomplete="new-password" placeholder=" " />
          <label for="setup-password">Password</label>
        </div>
        <p class="msg hint">At least 8 characters. You can use it to sign in without a code.</p>
        <p id="setup-error" class="msg error"></p>
        <button class="btn" type="submit">Finish</button>
      </form>

      <!-- password login -->
      <form id="login-form" class="hidden" novalidate>
        <div class="field">
          <input id="login-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder=" " />
          <label for="login-username">Username</label>
        </div>
        <div class="field">
          <input id="login-password" type="password" autocomplete="current-password" placeholder=" " />
          <label for="login-password">Password</label>
        </div>
        <p id="login-error" class="msg error"></p>
        <button class="btn" type="submit">Sign In</button>
      </form>

      <button id="switch-btn" class="link" type="button"></button>
    </div>
  </main>

  <!-- CHAT VIEW -->
  <div id="chat-view" class="chat hidden">
    <aside class="sidebar">
      <header class="sidebar-head">
        <div class="avatar" id="me-avatar"></div>
        <div class="me">
          <div class="me-name" id="me-name"></div>
          <div class="me-user" id="me-user"></div>
        </div>
        <button id="logout-btn" class="icon-btn" title="Sign out" aria-label="Sign out">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="M16 17l5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
        </button>
      </header>

      <div class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" />
        </svg>
        <input id="search-input" type="text" placeholder="Search by @username" autocomplete="off" autocapitalize="none" spellcheck="false" />
      </div>

      <div id="results" class="results"></div>
    </aside>

    <section class="panel">
      <div id="panel-empty" class="panel-empty">
        <span class="pill">Select a chat to start messaging</span>
      </div>

      <div id="conv" class="conv hidden">
        <header class="conv-head">
          <button id="back-btn" class="icon-btn back" aria-label="Back">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
          <div class="avatar" id="conv-avatar"></div>
          <div class="me">
            <div class="me-name" id="conv-name"></div>
            <div class="me-user" id="conv-user"></div>
          </div>
        </header>
        <div class="conv-body">
          <span class="pill" id="conv-hint"></span>
        </div>
        <footer class="conv-input">
          <input type="text" placeholder="Messaging opens in the next update" disabled />
        </footer>
      </div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
